name: Android kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - run: ./gradlew :designkit:testDebugUnitTest :designkit:lintDebug :app:lintDebug :app:assembleDebug :designkit:packageKit
      - name: Build against the distributed library
        run: |
          unzip -q designkit/build/distributions/*.zip -d "$RUNNER_TEMP/liquidglass"
          ./gradlew :app:assembleDebug -PkitRepository="$RUNNER_TEMP/liquidglass/maven"
      - name: Save the Maven archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liquidglass-maven
          path: designkit/build/distributions/*.zip
          if-no-files-found: error
