name: Capture gallery

on:
  pull_request:
    paths:
      - '.github/workflows/gallery.yml'
      - 'scripts/capture-gallery.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-gallery

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - run: ./gradlew --max-workers=2 :app:assembleDebug
      - name: Prepare the runner
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Capture the installed gallery
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python scripts/capture-gallery.py app/build/outputs/apk/debug/app-debug.apk gallery-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gallery-media
          path: gallery-output/
          if-no-files-found: error
